; Paths - Follower Ability Skilltree
;
; An add-on for Fight With Me: a perk tree for each follower role, drawn in its battle plan. A companion
; earns one perk point for every level past iPointsAboveLevel and spends it on the path of
; whatever role they have: new abilities, ranks in the ones they know, branches that add to
; them, and traits. Two abilities are carried into a fight at a time.
;
; Points come from the highest level a companion has reached, so someone you meet at level
; 30 already has twenty to spend, and a companion who was with you before this was installed
; gets every point their level earned. Changes here apply on the next load.

[Points]
; One point for every level past this one. 10: the first point at level 11, forty at level 50.
; 1 gives a point for every level from 2 on.
iPointsAboveLevel = 10

; Points every companion has on top, whatever their level.
iBonusPoints = 0

; Ranks can be given back (out of a fight) and a whole path started over, free. 0 makes
; every point spent for good.
bAllowRespec = 1

; The battle plan offers each companion unlimited points (and calls them a cheater for it).
; Switching it off puts them back exactly as they were. 0 removes the button.
bAllowUnlimitedPoints = 1
