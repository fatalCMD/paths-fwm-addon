; Path of the Companions
;
; A perk tree for each follower role. A companion earns one perk point for every level past
; iPointsAboveLevel and spends it on any of their paths: new abilities, ranks in the ones they
; know, branches that add to them, and traits. Only the path they follow counts in a fight, and
; two of its abilities are carried into it at a time. Companions also earn levels by fighting
; beside you, and some carry unique traits from their own mod.
;
; With Fight With Me installed, its battle plan gives each companion their role, and that is the
; path that counts; it also decides whom they fight and where they stand, and carries out what
; the abilities ask of a fight. Without it, the path a companion follows is chosen on their tree.
;
; Points come from the highest level a companion has reached, so someone you meet at level
; 30 already has twenty to spend, and a companion who was with you before this was installed
; gets every point their level earned.
;
; What you change in game (Mod Configuration > Path of the Companions) is saved to
; FightWithMePaths_user.ini, read after this file. Updates replace this file but never that one.

[Points]
; One point for every level past this one. 10: the first point at level 11, forty at level 50.
; 1 gives a point for every level from 2 on.
iPointsAboveLevel = 10

; Points every companion has on top, whatever their level.
iBonusPoints = 0

; Ranks can be given back (out of a fight) and a whole path started over, free. 0 makes
; every point spent for good.
bAllowRespec = 1

; Debug Mode offers free ranks, unlimited perk points and ability tests for each companion.
; Turning it off restores earned progression. 0 hides the button. Legacy key retained for saves/settings.
bAllowUnlimitedPoints = 1

[Leveling]
; Companions level up by fighting beside you. When a fight is over, each companion who was in
; it earns XP for every enemy the party brought down, whoever struck last; one who sat it out
; gets nothing. A level costs what one of yours would (fXPLevelUpBase + fXPLevelUpMult x
; level), and more on top the higher they are (fClimb). Each brings ten points of health,
; magicka or stamina by the role they fight as, and a point in that role's skills up to 100.
; Off: everyone goes back to the level their own mod gave them, and what levels gave them is
; taken off again.
bEnabled = true
; An even enemy's worth: this x the companion's level. Each level an enemy is above them adds
; 5%, up to 1.75 times; each level below takes 5% off, down to a quarter.
fXPPerEnemyLevel = 3
; A boss is worth this many times more.
fBossMult = 3
; How much a crowd adds: the enemy worth the most counts in full and each after it this share
; of the one before, so at 0.75 a fight is never worth more than four of its best enemy. 1:
; every enemy counts in full.
fCrowd = 0.75
; How much harder each level gets: a level costs this share more than one of yours would for
; every level they already have, so at 0.05 level 21 costs twice yours and level 41 three
; times. With fights of four even enemies that is about 6 fights a level at level 10, 8 at 30
; and 11 at 50. 0 is your own curve: 3 or 4 fights a level however high they are. Path points
; come one a level, so they slow down with it.
fClimb = 0.05
; Nobody passes your level: a companion at it gains no XP until you level up. One who was
; already above it keeps their level and waits for you.
bPlayerLevelCap = true

[PathBonus]
; Every point a companion spends on the path they follow makes them a little better at what
; it is for, in percent per point. Only the path they follow counts. The path page shows it
; beside the path's name.
; Fighter: attack speed. Tank: less damage from every blow, arrow and harmful spell (75%
; at most). Healer: healing, from their abilities, the spells they cast and the potions
; they drink. Bruiser: damage. Archer: faster stamina recovery in combat (90%
; at most). Mage: less magicka for every spell (75% off at most).
fFighterAttackSpeed = 1
fTankDamageTaken = 1
fHealerHealing = 1
fBruiserDamage = 1
fArcherStaminaRecovery = 1
fMageMagickaCost = 1

[Panel]
; The key that opens the panel (DirectInput scan code; 73 is Numpad 9, beside Fight With
; Me's battle plan on Numpad 7), and a modifier held with it: 0 none, 42 Shift, 29 Ctrl, 56 Alt.
iKey = 73
iKeyModifier = 0
; On a pad, hold LB and press this button: 1 D-pad up, 2 D-pad down, 4 left, 8 right,
; 4096 A, 8192 B, 16384 X, 32768 Y, 128 right stick. 0 = none. Fight With Me's battle plan
; uses D-pad down; Walk With Me's wheel the right stick, Y and D-pad up.
iGamepadKey = 8
; How fast the world runs while the panel is open, 1 for full speed.
fTimeScale = 0.1
; Hide the HUD while the panel is open.
bHideHUD = true
; Ease the camera over to the companion the panel shows, and back on close. Beside Fight
; With Me the battle plan's own setting counts there.
bCameraGlide = true
fCameraDistance = 260
fCameraHeight = 70
; With no enemies about, the camera comes face to face with the companion, this close.
fPortraitDistance = 95
; How fast the right stick, or dragging with the right mouse button, turns the view.
fOrbitSpeed = 1.0
; Size on top of the screen-height scaling.
fScale = 1.0

[Effects]
; Smaller summons for interiors; false restores the original large presentation.
bCompactSummons=true
; What the abilities look like in the world. The gameplay is the same without them. The
; meshes come with the POTC Effects download.
bEnabled = true

[Interface]
; 0 Vanilla (charcoal and silver), 1 Oxblood (the original red), 2 Nordic (engraved stone).
; With Fight With Me installed, its own choice applies to both menus.
iTheme = 1
; Short notices on the HUD when a companion uses an ability or has points to spend.
bNotices = true
; The game's own menu sounds in the panel.
bSounds = true
; Describe each control when you point at it or move to it with the pad.
bTooltips = true
; A translation to read, by the game's name for it (FRENCH, GERMAN...). Empty: the game's own.
sLanguage =

[PartyBalance]
; Reduce all normal follower weapon/spell damage and Paths ability damage.
; Counts nearby fighting companions, including creatures, but not the player or summons.
bEnabled = true
; Percentage points removed per additional follower, and per follower outnumbering enemies.
fExtraFollowerPenalty = 5
fOutnumberPenalty = 10
; Never reduce outgoing damage below this percentage. One follower stays at 100%.
fMinimumDamage = 50
